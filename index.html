        .text-accent{color:var(--accent);font-weight:bold;}
        .text-center{text-align:center;}
        .hidden{display:none!important;}
        .flex-center{display:flex;justify-content:center;align-items:center;}
        
        /* --- HEADER --- */

        .logo span{opacity:0.5;}

        .nav-tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:25px 0;background:var(--bg-card);padding:8px;border-radius:var(--radius);border:1px solid var(--border);}
        .tab-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:10px 18px;cursor:pointer;font-weight:600;font-size:0.85rem;transition:0.3s;border-radius:8px;flex:1;min-width:110px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;}
        .tab-btn i{font-size:1rem;}
        .tab-btn:hover{color:#fff;border-color:#fff;}
        .tab-btn.active{background:var(--primary);color:#000;border-color:var(--primary);box-shadow:0 0 15px rgba(255,255,255,0.2);font-weight:800;}
        
        /* --- SECTIONS --- */
        .section-card{background:var(--bg-card);padding:25px;border-radius:var(--radius);border:1px solid var(--border);animation:slideUp 0.4s ease;margin-bottom:20px;}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        
        h2{margin-bottom:20px;font-size:1.4rem;border-bottom:1px solid var(--border);padding-bottom:10px;display:flex;justify-content:space-between;align-items:center;color:#fff;}

        h3{margin-bottom:15px;font-size:1.1rem;color:var(--text-main);font-weight:600;}

        .brand-btn{flex:1;padding:15px;background:var(--bg-input);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--radius);cursor:pointer;font-weight:700;transition:0.3s;font-size:0.9rem;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;}
        .brand-btn i{font-size:1.2rem;}
        .brand-btn.active{border-color:var(--primary);color:#fff;background:#222;}
        
        /* --- PRICING --- */

        .price-card{background:var(--bg-input);padding:18px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border);text-align:center;transition:0.2s;position:relative;overflow:hidden;}

        .price{color:var(--accent);font-weight:600;font-size:0.95rem;}
        .price-usd{color:var(--text-muted);font-size:0.8rem;display:block;margin-top:3px;}

        .dot-red{background-color:#444;color:#444;border:1px solid #666;box-shadow:none;}
        .game-name{font-size:0.9rem;font-weight:500;}

        .map-price{color:#fff;font-weight:700;}
        input[type="checkbox"]{accent-color:#fff;width:18px;height:18px;cursor:pointer;}

        .note-box ul{padding-left:20px;margin-top:8px;}
        .note-box li{margin-bottom:6px;color:#ccc;list-style-type:square;}

        .input-group{margin-bottom:20px;}
        label{display:block;margin-bottom:8px;color:var(--text-muted);font-size:0.9rem;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
        select,input[type="text"],input[type="number"]{width:100%;padding:14px;background:var(--bg-input);border:1px solid var(--border);color:white;border-radius:var(--radius);font-size:1rem;outline:none;transition:0.3s;}
        select:focus,input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.1);}
        
        .btn-action{width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:var(--radius);font-size:1rem;font-weight:800;cursor:pointer;text-transform:uppercase;margin-top:10px;transition:0.3s;display:flex;justify-content:center;align-items:center;gap:10px;letter-spacing:0.5px;}
        .btn-action:hover{background:#ccc;transform:translateY(-2px);box-shadow:0 5px 20px rgba(255,255,255,0.1);}
        
        .btn-outline{background:transparent;border:1px solid #666;color:#ccc;margin-top:0;margin-bottom:20px;font-weight:600;font-size:0.9rem;padding:12px;display:flex;justify-content:center;align-items:center;gap:8px;}
        .btn-outline:hover{border-color:#fff;color:#fff;}
        
        .total-display{background:#1a1a1a;padding:18px 20px;border-radius:var(--radius);margin-top:25px;display:flex;justify-content:space-between;align-items:center;font-size:1.1rem;font-weight:700;border:1px solid var(--border);}

        .profile-img{width:120px;height:120px;border-radius:50%;border:2px solid #fff;margin-bottom:15px;object-fit:cover;}
        .group-list{display:flex;flex-direction:column;gap:15px;margin-top:20px;}
        .group-item{display:flex;align-items:center;background:var(--bg-input);padding:15px;border-radius:var(--radius);border:1px solid var(--border);text-decoration:none;color:#fff;transition:0.3s;}

        .group-info h4{font-size:1rem;margin-bottom:2px;}
        .group-info p{font-size:0.8rem;color:#888;}
        .group-arrow{margin-left:auto;color:#666;}
