<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Micaaaaaa ❤️</title>
    <!-- Import Font yang cute dan casual -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff8fa3;
            --dark-pink: #c9184a;
            --soft-white: #fff0f3;
            --accent-purple: #590d22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            height: 100vh;
            overflow: hidden; /* Biar gak ada scrollbar saat animasi */
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-purple);
            position: relative;
        }

        /* Canvas buat background effect */
        #heart-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container Utama */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(89, 13, 34, 0.2);
            backdrop-filter: blur(5px);
            max-width: 90%;
            width: 450px;
            transition: all 0.5s ease;
        }

        /* Animasi Masuk */
        .container.fade-out {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            color: var(--dark-pink);
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0px #fff;
            animation: float 3s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #800f2f;
            font-weight: 600;
        }

        /* Hati Besar yang bisa dipencet */
        .big-heart {
            font-size: 5rem;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s;
            margin: 1rem 0;
            filter: drop-shadow(0 5px 15px rgba(255, 0, 0, 0.3));
        }

        .big-heart:active {
            transform: scale(0.9);
        }

        .big-heart.beating {
            animation: heartbeat 0.8s infinite;
        }

        /* Tombol Utama */
        .btn {
            background: var(--dark-pink);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(201, 24, 74, 0.4);
            transition: all 0.3s ease;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(201, 24, 74, 0.6);
            background: #a4133c;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover::after {
            left: 100%;
        }

        /* Halaman Pesan (Love Letters) */
        .message-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 20;
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            border: 4px solid var(--primary-pink);
        }

        .message-screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .message-content h2 {
            font-family: 'Pacifico', cursive;
            color: var(--dark-pink);
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        .typing-text {
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 100px;
            margin-bottom: 1.5rem;
            color: #555;
            white-space: pre-wrap; /* Biar enter kebaca */
        }

        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .small-btn {
            background: var(--soft-white);
            color: var(--dark-pink);
            border: 2px solid var(--dark-pink);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        .small-btn:hover {
            background: var(--dark-pink);
            color: white;
        }

        /* Controls Animation */
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 50;
        }
        
        .control-icon {
            background: rgba(255,255,255,0.3);
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            transition: 0.3s;
        }
        .control-icon:hover { background: rgba(255,255,255,0.6); }

        /* Keyframes */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Responsiveness */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .container { padding: 1.5rem; }
            .big-heart { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas -->
    <canvas id="heart-canvas"></canvas>

    <!-- Halaman Utama (Intro) -->
    <main class="container" id="intro-container">
        <h1>Hai, Micaaaaaa!</h1>
        <p class="subtitle">Ada yang mau aku sampein nih... ❤️</p>
        
        <div class="big-heart beating" id="main-heart">❤️</div>
        
        <p style="margin-top: 10px; font-size: 0.9rem; color: #666;">
            (Coba sentuh hatinya biar seneng)
        </p>

        <button class="btn" id="open-btn">Buka Dong Ples!</button>
    </main>

    <!-- Halaman Pesan (Overlay) -->
    <section class="message-screen" id="message-modal">
        <div class="message-content">
            <h2 id="msg-title">Love Letter #1</h2>
            <div class="typing-text" id="msg-text"></div>
            
            <div class="nav-btns">
                <button class="small-btn" id="prev-btn" style="visibility: hidden;">Kemarin</button>
                <button class="small-btn" id="next-btn">Lanjut</button>
            </div>
        </div>
    </section>

    <!-- Controls -->
    <div class="controls">
        <button class="control-icon" id="toggle-anim" title="Pause/Play Background">⏸️</button>
    </div>

    <script>
        /**
         * LOGIC ANIMASI & INTERAKSI
         * Bahasa: Santai & Kekinian
         */

        // 1. Canvas Background Animation (Floating Hearts)
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let isAnimating = true;

        let width, height;
        let hearts = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Heart {
            constructor() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.speed = 1 + Math.random() * 2;
                this.size = 5 + Math.random() * 20;
                this.opacity = 0.5 + Math.random() * 0.5;
                this.oscillation = Math.random() * 20; // Gerak kiri kanan
                this.angle = 0;
                this.color = `rgba(255, ${100 + Math.random() * 100}, ${130 + Math.random() * 50},`;
            }

            update() {
                this.y -= this.speed;
                this.angle += 0.05;
                this.x += Math.sin(this.angle) * 0.5; // Gerak melayang

                // Reset kalau udah keluar layar atas
                if (this.y < -50) {
                    this.y = height + 50;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.fillStyle = this.color + this.opacity + ')';
                ctx.font = `${this.size}px Arial`;
                ctx.fillText('❤', this.x, this.y);
            }
        }

        function initHearts(count) {
            hearts = [];
            for (let i = 0; i < count; i++) {
                hearts.push(new Heart());
            }
        }

        function animate() {
            if (!isAnimating) return;
            ctx.clearRect(0, 0, width, height);
            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });
            animationId = requestAnimationFrame(animate);
        }

        initHearts(50);
        animate();

        // Kontrol Animasi Background
        const toggleBtn = document.getElementById('toggle-anim');
        toggleBtn.addEventListener('click', () => {
            isAnimating = !isAnimating;
            toggleBtn.textContent = isAnimating ? '⏸️' : '▶️';
            if (isAnimating) animate();
        });


        // 2. Interaksi Hati Besar
        const mainHeart = document.getElementById('main-heart');
        mainHeart.addEventListener('click', () => {
            // Bikin detaknya random dikit biar natural
            const randomBeat = 0.5 + Math.random() * 0.5;
            mainHeart.style.animationDuration = `${randomBeat}s`;
            
            // Efek visual kecil (bisa tambah sound kalau mau)
            createClickParticles(mainHeart);
        });

        // Efek partikel kecil saat hati diklik
        function createClickParticles(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.innerText = '❤️';
                p.style.position = 'fixed';
                p.style.left = centerX + 'px';
                p.style.top = centerY + 'px';
                p.style.fontSize = '1.2rem';
                p.style.pointerEvents = 'none';
                p.style.transition = 'transform 0.8s ease-out, opacity 0.8s ease-out';
                p.style.zIndex = '100';
                document.body.appendChild(p);

                // Animasi meledak
                setTimeout(() => {
                    const angle = (Math.PI * 2 * i) / 8;
                    const dist = 50 + Math.random() * 50;
                    p.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`;
                    p.style.opacity = '0';
                }, 10);

                setTimeout(() => p.remove(), 800);
            }
        }

        // 3. Logic Buka Pesan (Typing Effect)
        const openBtn = document.getElementById('open-btn');
        const introContainer = document.getElementById('intro-container');
        const messageModal = document.getElementById('message-modal');
        const msgTitle = document.getElementById('msg-title');
        const msgText = document.getElementById('msg-text');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');

        // Daftar Pesan Buat Micaaaaaa
        const loveNotes = [
            {
                title: "Kenapa Mica?",
                text: "Sebenernya aku bingung harus mulai dari mana...\n\nCuma pengen bilang, sejak kenal kamu, hari-hari aku jadi lebih berwarna. Senyum kamu itu 'medicine' paling ampuh kalau aku lagi bad mood."
            },
            {
                title: "Kamu Itu Spesial",
                text: "Bukan cuma cantik atau lucu aja, tapi cara kamu mikir, cara kamu ngertiin hal-hal kecil, itu yang bikin aku makin nge-fans.\n\nMakasih ya udah jadi orang yang paling asik buat diajak ngomong apa aja."
            },
            {
                title: "Masa Depan...",
                text: "Aku nggak tau bakal terjadi apa besok atau lusa, tapi satu hal yang aku pastiin...\n\nAku pengen kamu ada di setiap babak ceritaku. Iya, kamu. Micaaaaaa ❤️"
            },
            {
                title: "Penutup",
                text: "Jangan pernah lupa kalau kamu tuh berharga banget.\n\nI Love You, Micaaaaaa! ❤️❤️❤️\n\n(Ini web spesial buat kamu, jangan di-close ya biar sayang hehe)"
            }
        ];

        let currentNoteIndex = 0;
        let isTyping = false;

        openBtn.addEventListener('click', () => {
            // Transisi halaman
            introContainer.classList.add('fade-out');
            setTimeout(() => {
                messageModal.classList.add('active');
                showNote(0);
                triggerConfetti(); // Rayakan waktu buka!
            }, 500);
        });

        function showNote(index) {
            if (index < 0 || index >= loveNotes.length) return;
            
            currentNoteIndex = index;
            msgTitle.innerText = loveNotes[index].title;
            msgText.innerHTML = ''; // Reset text
            
            // Atur tombol navigasi
            prevBtn.style.visibility = index === 0 ? 'hidden' : 'visible';
            nextBtn.innerText = index === loveNotes.length - 1 ? 'Selesai' : 'Lanjut';

            // Mulai efek mengetik
            typeWriter(loveNotes[index].text, msgText);
        }

        function typeWriter(text, element) {
            isTyping = true;
            nextBtn.disabled = true; // Kunci tombol saat ngetik
            prevBtn.disabled = true;
            element.style.opacity = '1';
            
            let i = 0;
            const speed = 40; // Kecepatan ngetik

            function type() {
                if (i < text.length) {
                    // Handle enter karakter (\n)
                    if (text.charAt(i) === '\n') {
                        element.innerHTML += '<br>';
                    } else {
                        element.innerHTML += text.charAt(i);
                    }
                    i++;
                    setTimeout(type, speed);
                } else {
                    isTyping = false;
                    nextBtn.disabled = false;
                    prevBtn.disabled = false;
                }
            }
            type();
        }

        nextBtn.addEventListener('click', () => {
            if (isTyping) return;
            if (currentNoteIndex < loveNotes.length - 1) {
                showNote(currentNoteIndex + 1);
            } else {
                // Kalau udah selesai, confetti lagi!
                triggerConfetti();
                alert("Semoga kamu suka ya, Micaaaaaa! ❤️"); // Sedikit interaksi penutup
            }
        });

        prevBtn.addEventListener('click', () => {
            if (isTyping) return;
            showNote(currentNoteIndex - 1);
        });

        // 4. Efek Confetti (Perayaan Simpel)
        function triggerConfetti() {
            const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd'];
            for (let i = 0; i < 100; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'fixed';
                conf.style.zIndex = '1000';
                conf.style.left = '50%';
                conf.style.top = '50%';
                conf.style.width = Math.random() * 10 + 5 + 'px';
                conf.style.height = Math.random() * 10 + 5 + 'px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(conf);

                // Random direction explosion
                const angle = Math.random() * Math.PI * 2;
                const velocity = 2 + Math.random() * 5;
                let x = 0, y = 0;
                let opacity = 1;

                const anim = setInterval(() => {
                    x += Math.cos(angle) * velocity;
                    y += Math.sin(angle) * velocity + 2; // Gravity
                    opacity -= 0.02;
                    
                    conf.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random()*360}deg)`;
                    conf.style.opacity = opacity;

                    if (opacity <= 0) {
                        clearInterval(anim);
                        conf.remove();
                    }
                }, 16);
            }
        }
    </script>
</body>
</html>
